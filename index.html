<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d9efff" />
    <meta
      name="description"
      content="15 道真实职场场景题，从收入、时间、成长、人际和心理状态看清你的职场幸福度。"
    />
    <title>今天要离职吗？｜职场幸福度测评</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235987f7'/%3E%3Cpath d='M32 10c2 13 9 20 22 22-13 2-20 9-22 22-2-13-9-20-22-22 13-2 20-9 22-22Z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell" id="app">
      <section class="quiz-view" id="quizView" aria-live="polite">
        <header class="brand-panel glass-panel">
          <div class="brand-mark" aria-hidden="true">✦</div>
          <div>
            <p class="eyebrow">WORKPLACE CHECK-IN</p>
            <h1>今天要离职吗？</h1>
            <p class="brand-subtitle">职场幸福度测评 · 15 道真实场景题</p>
          </div>
        </header>

        <section class="progress-panel" aria-label="答题进度">
          <div class="progress-copy">
            <span class="dimension-pill" id="dimensionPill"></span>
            <span class="question-count"><strong id="questionNumber">01</strong> / 15</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="progressBar"></span>
          </div>
          <div class="dimension-steps" id="dimensionSteps"></div>
        </section>

        <article class="question-panel glass-panel" id="questionPanel">
          <p class="question-note" id="questionNote"></p>
          <h2 id="questionText"></h2>
          <p class="question-help">选择最接近你真实状态的一项</p>
          <div class="options-list" id="optionsList" role="radiogroup" aria-label="答案选项"></div>
        </article>

        <nav class="quiz-nav" aria-label="题目导航">
          <button class="button button-secondary" id="previousButton" type="button">
            <span aria-hidden="true">‹</span> 上一题
          </button>
          <button class="button button-primary" id="nextButton" type="button" disabled>
            <span id="nextButtonLabel">下一题</span> <span aria-hidden="true">›</span>
          </button>
        </nav>

        <div class="local-tools">
          <span>答案仅保存在当前设备</span>
          <button id="clearButton" type="button">清空</button>
        </div>
      </section>

      <section class="result-view" id="resultView" hidden aria-live="polite">
        <header class="result-heading">
          <p class="eyebrow">YOUR WORKPLACE WEATHER</p>
          <h1>你的职场晴雨表</h1>
          <p>这不是离职指令，是一次更诚实的状态盘点。</p>
        </header>

        <section class="score-panel glass-panel">
          <div class="score-orbit" id="scoreOrbit">
            <div class="score-core">
              <strong id="totalScore">0</strong>
              <span>职场幸福度</span>
            </div>
          </div>
          <p class="overall-comment" id="overallComment"></p>
          <div class="personality-badge" id="personalityTitle"></div>
          <p class="percentile" id="percentile"></p>
        </section>

        <section class="result-section glass-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">FIVE DIMENSIONS</p>
              <h2>五维状态</h2>
            </div>
            <span class="section-mark" aria-hidden="true">⌁</span>
          </div>
          <div class="dimension-results" id="dimensionResults"></div>
        </section>

        <section class="result-section insight-panel glass-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">WHAT IT MEANS</p>
              <h2>你的状态画像</h2>
            </div>
            <span class="section-mark" aria-hidden="true">✦</span>
          </div>
          <p class="personality-description" id="personalityDescription"></p>
          <div class="analysis-copy" id="analysisCopy"></div>
        </section>

        <section class="focus-grid" aria-label="优势与关注项">
          <div class="focus-item focus-strong">
            <span>最稳的一项</span>
            <strong id="strongestDimension"></strong>
          </div>
          <div class="focus-item focus-weak">
            <span>最需关注</span>
            <strong id="weakestDimension"></strong>
          </div>
        </section>

        <button class="button button-primary restart-button" id="restartButton" type="button">
          重新测一次 <span aria-hidden="true">↻</span>
        </button>
      </section>

      <footer class="site-footer">
        <span>清醒一点，也温柔一点。</span>
        <span>结果仅供自我梳理，不替你做职业决定。</span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
